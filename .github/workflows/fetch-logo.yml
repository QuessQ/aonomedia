name: fetch-assets
on:
  push:
    branches: [sillage-deploy]
    paths: ['.github/workflows/fetch-logo.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p img
          B=https://d8j0ntlcm91z4.cloudfront.net/user_3Az6LgWFNjz9OIp3c5PKw9fYBXq/hf_20261107_164156_
          while read name id; do curl -fsSL "${B}${id}.png" -o "img/${name}.png"; done <<'LIST'
          hero-wide 9d754b7f-de37-4845-b877-2c830879e845
          hero-tall 2f0b15ea-bad3-4aff-adac-f2f40b2b5eb1
          mem-rain cd07ce0b-e649-4dc5-ab64-48846c1b129b
          mem-fig c892286b-a7d5-4608-bfe0-fea0cec8e6a6
          mem-fire 3babb4d9-6af8-4988-b20d-63f337748318
          mem-cedar f63de689-3fbd-4438-9cf9-1ea92162c07b
          mem-jasmine 673a7607-6060-44f6-a6d5-8fda8dfa451f
          mem-ocean 9c955ecb-fb49-4eef-981f-a595387ababc
          mem-library 5312cbb8-4019-4da8-afca-0a272f40aee2
          mem-bakery 08b2133b-91a0-440a-ad63-d73b15d7e07b
          lineup ebde3b11-9bcf-40b7-a786-1b76c85841f7
          drop f1f11619-eec0-4fb9-bf19-d26731528117
          LIST
          ls -la img
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add img && git commit -m "Fetch Sillage imagery" && git push
